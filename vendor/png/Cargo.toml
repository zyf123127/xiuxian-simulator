[dependencies.bitflags]
version = "1.0"

[dependencies.crc32fast]
version = "1.2.0"

[dependencies.fdeflate]
version = "0.3.3"

[dependencies.flate2]
# PATCH(getfish) v1.16.23 size-knife: explicit miniz_oxide-only backend; the
# crates.io default (rust_backend+runtime_detection) currently resolves the
# same, but pinning it keeps any future default flip from dragging a C-zlib
# path back into the wasm.
version = "1.0.11"
default-features = false
features = ["miniz_oxide"]

# PATCH(getfish) v1.16.23 size-knife: miniz_oxide pinned 0.8(+simd) -> 0.9
# default-features=false so png shares ONE miniz_oxide 0.9.x with flate2's
# rust_backend chain (was: miniz_oxide 0.8.9 AND 0.9.1 both linked into the
# wasm). simd dropped: simd-adler32 stays in the tree via fdeflate anyway,
# and miniz_oxide's simd knob only swaps the adler32 backend (no size win).
# inflate::stream needs alloc, hence with-alloc (flate2 requests it too).
[dependencies.miniz_oxide]
version = "0.9"
default-features = false
features = ["with-alloc"]

[dev-dependencies.approx]
version = "0.5.1"

