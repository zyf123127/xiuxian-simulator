<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>凡人模拟·轮回模拟器</title>
    <meta name="description" content="凡人模拟·轮回模拟器 —— 修仙放置 H5 游戏：轮回镜中推演一生、天赋抽取、造化继承、宿敌血仇、山河图志六大地点、洞府经营与四时气象。Rust + WebAssembly，打开即玩。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%98%AF%3C/text%3E%3C/svg%3E" />
    <style>
        html, body, canvas {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            z-index: 0;
        }
        canvas {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            /* v1.6.0 B 清晰度：wasm 侧已开 high_dpi，backing store = CSS×dpr 恰好
               1:1 物理像素，无需任何 image-rendering 处理；此前 pixelated 在 dpr>1
               时对 1× 位图做非整数倍最近邻放大反而导致文字发虚，已移除。 */
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            justify-content: center;
            color: #ffd782;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 16px;
            background: #0a0818;
            z-index: 10;
            opacity: 1;
            transition: opacity .6s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading .bar {
            width: 180px; height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,.12);
            overflow: hidden;
        }
        #loading .bar i {
            display: block; height: 100%; width: 40%;
            border-radius: 3px;
            background: #ffd782;
            animation: slide 1.1s ease-in-out infinite alternate;
        }
        @keyframes slide { from { margin-left: 0; } to { margin-left: 60%; } }
        #errlog {
            position: fixed; top: 0; left: 0;
            color: #f66; background: rgba(0,0,0,.85);
            font: 12px/1.4 Consolas, monospace;
            white-space: pre-wrap; z-index: 99; padding: 4px;
            max-width: 100%; max-height: 100%; overflow: auto;
            transition: opacity 1.2s;
            /* v1.9.23 调试开关：默认隐藏——?dbg=1 或真错误（[ERR]/[PANIC]）才显示 */
            display: none;
        }
        #errlog.xx-on { display: block; }
        /* v1.9.17 诊断日志自动淡化：满屏 [诊断]/[SIM] 红字对玩家就是"报错"——
           加载 30 秒后淡至 0.12（正常游玩不被打扰，真机排障截图仍可辨读）；
           一旦出现 [ERR]/[PANIC]/重载类关键行立刻恢复全显。 */
        #errlog.xx-dim { opacity: 0.12; }
        #errlog.xx-alert { opacity: 1; }
    </style>
</head>
<body>
    <div id="loading">
        <div id="ld_msg">凡人模拟 · 加载中…</div>
        <div class="bar"><i></i></div>
        <div style="font-size:12px;color:#b8a8e0;">首次加载约需 10~40 秒，二次进入将快很多</div>
    </div>
    <div id="errlog"></div>
    <canvas id="glcanvas" tabindex='1'></canvas>
    <!-- miniquad 加载器：https://github.com/not-fl3/macroquad/blob/master/js/mq_js_bundle.js -->
    <!-- 缓存穿透：每次发版改 GAME_VER，wasm/bundle URL 带上版本参数，WebView 不会用旧缓存 -->
    <script>var GAME_VER = "1.15.0";</script>
    <!-- v1.9.10 固定超采样（修真机"画质变模糊"）：dpr=1 坐标制保持不变（坐标正确性
         的根基，绝不回退），清晰度改为在 canvas 尺寸源头叠加固定倍率 SS=3——
         覆盖 canvas 实例的 clientWidth/clientHeight getter（×SS，封顶 4096），
         miniquad 自己的启动/resize 路径（setup_canvas_size→resize() 里
         clientWidth×dpi_scale()）据此把 backing 开到 CSS×3：与 v1.9.8 真机跑通
         的 2772x1280 完全同一条代码路径（X5 已验证 60fps），且发生在 GL 建上下文
         之后的常规初始化阶段，无运行中 canvas 手术（v1.9.6 冻帧教训）。
         SS 是确定性常数而非 devicePixelRatio：本地与手机同构不被破坏；
         Rust 侧零 dpi 乘除、cam.rs 零改动，坐标仍在唯一坐标系（backing）。
         ?ss=1 可临时回到 v1.9.9 观感做 A/B（本地回归用）。 -->
    <script>
        // v1.15.0 音频保活：包装 AudioContext 构造器捕获实例——容器（X5/TapTap）
        // 的自动播放策略会把 AudioContext 挂起（suspended），页面随之处于
        // "静音"态、失去 intensive-throttling 的可听页豁免（帧泵被钳 →
        // 点按钮迟钝）。触摸处理器每次 touchstart 对挂起的实例 resume。
        (function () {
            try {
                var _AC = window.AudioContext || window.webkitAudioContext;
                if (!_AC) return;
                function WrappedAC() {
                    var ctx = new (Function.prototype.bind.apply(_AC, [null].concat(Array.prototype.slice.call(arguments))))();
                    (window.__xxACs = window.__xxACs || []).push(ctx);
                    return ctx;
                }
                WrappedAC.prototype = _AC.prototype;
                window.AudioContext = WrappedAC;
                window.webkitAudioContext = WrappedAC;
            } catch (e) { /* 捕获失败不影响音频功能本身 */ }
        })();
        // v1.15.0 可听保活：真 X5 内核（QQ浏览器/MuMu 2026-10-31）实测——触摸
        // 唤醒后帧率仅 0.9fps（车夫 1s 拍恰=0.9fps）：容器对"静音页"施加
        // intensive throttling，钳死 rAF/定时器/MessageChannel 一切时钟；触摸
        // burst 只能一击 +8 帧。对策：用页面上首个 AudioContext 循环播放
        // 近无声脉冲（增益 0.004，物理不可闻），使页面处于 audible 态——
        // Chromium 系对可听页豁免 intensive throttling。游戏自身 BGM 亦可，
        // 但 X5 上音频解码可能永不完成（见 sounds.rs 懒加载），保活须独立于它。
        window.xxStartKeepAlive = function () {
            // v1.15.0 启动失败可见化：任何一步异常/挂起都写 errlog（节流）——
            // 真机截图即得失败原因，不再盲查
            var kaLog = function (s) {
                try {
                    var now = performance.now();
                    if (window.__xxKaLogAt && now - window.__xxKaLogAt < 10000) return;
                    window.__xxKaLogAt = now;
                    var el = document.getElementById("errlog");
                    if (el) el.textContent += "[保活] " + s + "\n";
                } catch (e0) {}
            };
            try {
                if (window.__xxKeepAlive) return;
                var acs = window.__xxACs || [];
                var ctx = null;
                for (var i = 0; i < acs.length; i++) {
                    var c0 = acs[i];
                    if (c0 && c0.state === "running") { ctx = c0; break; }
                    if (c0 && c0.state === "suspended" && c0.resume) {
                        try {
                            var r = c0.resume();
                            if (r && r["catch"]) r["catch"](function () {});
                        } catch (eR) { kaLog("resume 异常: " + eR); }
                    }
                }
                if (!ctx) {
                    // X5 实测：quad-snd 的上下文 suspended 且 resume/解码可能永不
                    // 完成；而探针实证 X5 上 new AudioContext() 直接 running——
                    // 无条件自建专用保活上下文（构造器已包装，自动入捕获表）
                    var AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) { kaLog("无 AudioContext 构造器"); return; }
                    ctx = new AC();
                    if (ctx.state !== "running" && ctx.resume) {
                        try {
                            var r2 = ctx.resume();
                            if (r2 && r2["catch"]) r2["catch"](function () {});
                        } catch (eR2) { kaLog("自建 ctx resume 异常: " + eR2); }
                    }
                    if (ctx.state !== "running") {
                        kaLog("等待 ctx running（state=" + ctx.state + "）");
                        return;
                    }
                }
                var sr = ctx.sampleRate || 44100;
                var buf = ctx.createBuffer(1, sr, sr); // 1s 循环
                var d = buf.getChannelData(0);
                d[0] = 0.03;
                d[1] = -0.03; // 仅头两样本有幅值：周期性近无声咔哒
                var src = ctx.createBufferSource();
                src.buffer = buf;
                src.loop = true;
                var gn = ctx.createGain();
                gn.gain.value = 0.004;
                src.connect(gn);
                gn.connect(ctx.destination);
                src.start();
                window.__xxKeepAlive = 1;
                try {
                    var el3 = document.getElementById("errlog");
                    if (el3) el3.textContent += "[保活] 音频保活已启动（ctx running，near-silent loop）\n";
                } catch (e5) {}
            } catch (e) {
                kaLog("启动异常: " + (e && e.message ? e.message : e));
            }
        };
        // ctx 就绪时机不定（用户手势后才 running）：随触摸调用外，每秒补试
        setInterval(function () { if (window.xxStartKeepAlive) window.xxStartKeepAlive(); }, 1000);
        // v1.10.2 默认 SS 3→2（内存/帧率修复）：收益 = GPU backing 720p 类屏
        // 3840x2160(66MB 双缓冲)→2560x1440(29MB)，-37MB；填充率 9x→4x（-56% fragment），
        // 全屏 alpha 叠加型 UI（背景+日志底+面板+模态罩层）直接受益。
        // 画质折中：dpr<=2 设备 SS=2 恰好 >=1:1 物理像素（dpr≈2 时 1:1 最优，无感知）；
        // dpr>2（≥2.5 主流手机）维持 3 避免浏览器阶段 ~1.6x 整帧放大的发软回归
        // （v1.9.10 教训）。?ss= 参数覆盖优先级不变（真机 A/B 仍可 ?ss=3 对照）。
        var XX_SS = (window.devicePixelRatio || 1) > 2 ? 3 : 2;
        try {
            var __ssq = new URLSearchParams(location.search).get("ss");
            if (__ssq) XX_SS = Math.max(1, Math.min(4, parseInt(__ssq, 10) || 1));
        } catch (e) {}
        (function () {
            try {
                var c = document.getElementById("glcanvas");
                var cap = function (v) { return Math.min(4096, Math.max(1, Math.round(v))); };
                // clientWidth/clientHeight 定义在 Element.prototype（部分内核在更
                // 深层）——沿原型链找原生 getter，找不到则维持 v1.9.9 尺寸不硬来
                var findGetter = function (name) {
                    var p = c;
                    while (p) {
                        var d = Object.getOwnPropertyDescriptor(p, name);
                        if (d && d.get) return d.get;
                        p = Object.getPrototypeOf(p);
                    }
                    return null;
                };
                var gw = findGetter("clientWidth");
                var gh = findGetter("clientHeight");
                if (!gw || !gh) return;
                Object.defineProperty(c, "clientWidth", {
                    get: function () { return cap(gw.call(c) * XX_SS); },
                    configurable: true
                });
                Object.defineProperty(c, "clientHeight", {
                    get: function () { return cap(gh.call(c) * XX_SS); },
                    configurable: true
                });
            } catch (e) { /* 覆盖失败则维持 v1.9.9 尺寸，功能不受影响 */ }
        })();
    </script>
    <script src="mq_js_bundle.js?v=1.15.0"></script>
    <script>
        // v1.5.0 H5 本地存档：注册 miniquad 插件，为 wasm 提供 localStorage 存取的 env 导入。
        // 必须在 load() 之前注册（register_plugins 在 wasm 实例化前消费 plugins 列表）。
        // Rust 侧 save.rs 的 wasm 后端按固定键读写，存档内容与桌面版 xiuxian_save.txt 完全同格式；
        // 长度一律 UTF-8 字节数（Rust 侧按字节分配缓冲区，中文字段 3 字节/字）。
        window.miniquad_add_plugin({
            name: "xx_storage",
            version: 1,
            register_plugin: function (importObject) {
                var XX_KEY = "xiuxian_save";
                importObject.env.xx_save_len = function () {
                    try {
                        var v = localStorage.getItem(XX_KEY);
                        return v == null ? -1 : new TextEncoder().encode(v).length;
                    } catch (e) { return -1; }
                };
                importObject.env.xx_save_read = function (ptr, len) {
                    try {
                        var v = localStorage.getItem(XX_KEY) || "";
                        var bytes = new TextEncoder().encode(v);
                        var arr = new Uint8Array(wasm_memory.buffer, ptr, len);
                        arr.set(bytes.subarray(0, len));
                    } catch (e) { console.error("xx_save_read:", e); }
                };
                importObject.env.xx_save_write = function (ptr, len) {
                    try {
                        var bytes = new Uint8Array(wasm_memory.buffer, ptr, len);
                        localStorage.setItem(XX_KEY, new TextDecoder("utf-8").decode(bytes));
                    } catch (e) { console.error("xx_save_write:", e); }
                };
            },
            on_init: function () {}
        });

        // v1.6.0 B 清晰度（移植自 GetFish v7.9.6）：GPU 能力懒探测。vendor/macroquad
        // 图集封顶补丁在 wasm 首次询问 gf_max_texture_size 时——此时 miniquad 已在
        // glcanvas 上建好渲染上下文——直接查询 MAX_TEXTURE_SIZE，图集按
        // min(设备上限) 动态封顶，配合 high_dpi 支撑 dpr>1 设备的原生字形栅格。
        // 必须在 load() 之前注册（与 xx_storage 同理）。
        var XX_GPU_OK = !!(window.WebGLRenderingContext || window.WebGL2RenderingContext);
        var XX_MAX_TEX = 0; // 0 = 未探测
        function xx_probe_max_tex() {
            if (XX_MAX_TEX) return XX_MAX_TEX;
            try {
                var c = document.getElementById("glcanvas");
                var gl = c.getContext("webgl2") || c.getContext("webgl") ||
                         c.getContext("experimental-webgl");
                if (gl) {
                    var v = gl.getParameter(gl.MAX_TEXTURE_SIZE);
                    if (typeof v === "number" && v > 0) XX_MAX_TEX = v;
                }
            } catch (e) { /* 探测失败走默认，图集侧另有 512 下限兜底 */ }
            if (!XX_MAX_TEX) XX_MAX_TEX = 8192;
            return XX_MAX_TEX;
        }
        window.miniquad_add_plugin({
            name: "xx_gpu",
            version: 1,
            register_plugin: function (importObject) {
                importObject.env.gf_max_texture_size = function () { return xx_probe_max_tex() | 0; };
            },
            // v1.8.2 注意：on_init 是无参调用（bundle: e[t].on_init()），拿不到
            // exports；就绪信号改由下方 WebAssembly.instantiate 钩子赋值。
            on_init: function () {}
        });

        // v1.9.10 wasm 陷阱可见化 + 回归断言信号（Rust 侧 main.rs xx_dbg 模块声明
        // 了这两个 env 导入——wasm 实例化会校验导入存在，二者必须成对出现）：
        // xx_panic：Rust panic hook 把 panic 原文写入 errlog（[PANIC] 前缀）并改
        //   document.title——此前 wasm 陷阱在真机上完全静默（F 冻结但 errlog 无记录，
        //   无法区分"容器时钟停摆"与"Rust 陷阱/互斥锁中毒"，十轮真机排查的盲区）。
        // xx_state：场景变化上报（0=Menu 1=Reality 2=Draft 3=Sim …），供 ?tap=
        //   自动回归断言"点按钮 → __xxState 离开 0（进游戏）"。
        window.__xxState = -1;
        window.miniquad_add_plugin({
            name: "xx_dbg",
            version: 1,
            register_plugin: function (importObject) {
                importObject.env.xx_panic = function (ptr, len) {
                    try {
                        var mem =
                            window.wasm_memory && window.wasm_memory.buffer
                                ? window.wasm_memory.buffer
                                : window.wasm_exports && window.wasm_exports.memory
                                  ? window.wasm_exports.memory.buffer
                                  : null;
                        if (mem) {
                            var msg = new TextDecoder("utf-8", { fatal: false }).decode(
                                new Uint8Array(mem, ptr, Math.min(len | 0, 512)),
                            );
                            var el = document.getElementById("errlog");
                            if (el) el.textContent += "[PANIC] " + msg + "\n";
                            // v1.15.0 重入定位：panic 时刻的 JS 同步栈——若 panic 由
                            // "帧中重入 wasm 导出"引起，栈会显示重入的 JS 中转函数。
                            // 打到独立全屏面板（errlog 8KB 封顶会把栈截掉）
                            if (!window.__xxPanicStacked) {
                                window.__xxPanicStacked = 1;
                                try {
                                    var st = String(new Error().stack || "").slice(0, 1200);
                                    if (el) el.textContent += "[PANIC@JS] " + st + "\n";
                                    var pd = document.getElementById("xx_panic_stack");
                                    if (!pd) {
                                        pd = document.createElement("div");
                                        pd.id = "xx_panic_stack";
                                        pd.style.cssText =
                                            "position:fixed;left:0;top:0;right:0;z-index:200;" +
                                            "background:rgba(60,0,0,.92);color:#ffd9d9;" +
                                            "font:9px/1.3 Consolas,monospace;white-space:pre-wrap;" +
                                            "word-break:break-all;padding:4px;max-height:45%;" +
                                            "overflow:hidden;pointer-events:none;";
                                        document.body.appendChild(pd);
                                    }
                                    pd.textContent = "[PANIC@JS]\n" + st;
                                } catch (e3) {}
                            }
                            try { document.title = "PANIC " + msg.slice(0, 60); } catch (e2) {}
                        }
                    } catch (e) {}
                };
                importObject.env.xx_state = function (code) {
                    window.__xxState = code | 0;
                };
                // v1.9.12 三通道（Rust xx_dbg 模块声明，须成对）：
                // xx_click：Rust 每消费一次点击上报计数（桥看门狗数据源）
                // xx_js_fr：JS 帧时钟心跳年龄 ms（Rust 画进菜单自检面板）
                // xx_js_touches：JS 侧累计触摸组数（同上）
                importObject.env.xx_click = function (n) {
                    window.__xxClicksSeen = n | 0;
                    // v1.15.0 触→消费延迟：用户反馈"点按钮很卡"的真机直接度量——
                    // 从 touchstart 到 Rust 消费 pressed 边沿的墙钟时间。
                    if (window.__xxTapAt != null) {
                        var dt = performance.now() - window.__xxTapAt;
                        window.__xxTapLat = dt | 0;
                        if (dt > (window.__xxTapLatMax || 0)) window.__xxTapLatMax = dt | 0;
                        window.__xxTapAt = null;
                    }
                };
                importObject.env.xx_js_fr = function () {
                    return Math.min(999999, Math.round(performance.now() - (window.__xxFrameAt || 0)));
                };
                importObject.env.xx_js_touches = function () {
                    return window.__xxTouches || 0;
                };
                // v1.9.13 循环心跳（Rust 每 30 帧上报帧号）——JS 看门狗据此
                // 识别"循环死亡"（真机实证：首次真触摸杀死 async 主循环，
                // frame() 照常返回、fr 恒新鲜，唯一死证是 Rust 帧号停止前进）
                importObject.env.xx_alive = function (n) {
                    window.__xxAlive = { n: n | 0, at: performance.now() };
                };
            },
            on_init: function () {}
        });

        // v1.10.2 存档落盘去抖的强制兜底：Rust 侧 sync_save 置脏后延迟落盘
        // （主循环 ≥3s 或场景/弹窗边界才写），手机 WebView 切后台/被强杀时 rAF
        // 停摆、3s 定时不再到来——本钩子在 pagehide / visibilitychange(hidden)
        // 时经 wasm_exports 读取 Rust 侧最近一次 sync_save 的存档快照写入
        // localStorage（键与 xx_storage 插件的 XX_KEY 一致），丢档窗口 ≤3s。
        // wasm_exports 由下方 WebAssembly.instantiate 钩子挂载；兜底失败静默
        // （localStorage 配额/解码异常不阻断页面卸载）。
        function xxFlushPendingSave() {
            try {
                var e = window.wasm_exports;
                if (!e || !e.xx_save_pending_len || !e.xx_save_pending_ptr) return;
                var len = e.xx_save_pending_len() | 0;
                if (len <= 0) return;
                var ptr = e.xx_save_pending_ptr();
                if (!ptr) return;
                var bytes = new Uint8Array(e.memory.buffer, ptr, len);
                localStorage.setItem("xiuxian_save", new TextDecoder("utf-8").decode(bytes));
            } catch (err) { /* 兜底失败不阻断卸载 */ }
        }
        window.addEventListener("pagehide", xxFlushPendingSave);
        document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "hidden") xxFlushPendingSave();
        });

        // v1.8.2 关键修复：加载层"就绪"信号。此前 window.wasm_exports 从未被
        // 任何人赋值——12 秒看门狗必然把加载层变成"加载失败·点击重试"覆盖层

                var compat = q.get("compat") !== "0"; // 默认带兼容鼠标事件
                var iv = setInterval(function () {
                    if (!window.wasm_exports) return;
                    tries++;
                    var st = window.__xxState;
                    if (st === 1) {
                        clearInterval(iv);
                        log("[FLOW] ✓✓ 进入 Reality（进游戏成功）compat=" + compat +
                            (early ? " 早期时序" : "") + " 第" + tries + "次轮询确认");
                    } else if (st > 1) {
                        clearInterval(iv);
                        log("[FLOW] ？意外场景 st" + st);
                    } else if (tries === 3 && !fired) {
                        fired = true;
                        log("[FLOW] ①点「开始新的人生」(compat=" + compat + (early ? " 早期时序" : "") + ")");
                        fireTap(470, 549, compat);
                    } else if (tries > 200) {
                        clearInterval(iv);
                        log("[FLOW] ✗ 超时：点击后未进游戏，末态 st" + st);
                    }
                }, 300);
            }
        })();

        // v1.9.1 关键修复：删除 macroquad 模板遗留的"load 事件隐藏加载层"。
        // window.load 只等文档资源就绪，不等 wasm（fetch 不阻塞 load）——加载层
        // 在页面打开约 1 秒内就被 display:none 撤掉，之后手机上 wasm 下载+编译的
        // 10~40 秒里玩家面对纯黑画布：分阶段提示与 45s 重试看门狗全部被废，
        // 点哪都没反应（TapTap 真机"无法进入游戏、点击没反应"的最终根因）。
        // 加载层的隐藏只由 pollFirstFrame 负责：window.wasm_exports 就绪才撤。

    </script>
