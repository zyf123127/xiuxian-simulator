<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>凡人修仙·轮回模拟器</title>
    <meta name="description" content="凡人修仙·轮回模拟器 —— 修仙放置 H5 游戏：轮回镜中推演一生、天赋抽取、造化继承、宿敌血仇、山河图志六大地点、洞府经营与四时气象。Rust + WebAssembly，打开即玩。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%98%AF%3C/text%3E%3C/svg%3E" />
    <style>
        html, body, canvas {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            z-index: 0;
        }
        canvas {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            /* v1.6.0 B 清晰度：wasm 侧已开 high_dpi，backing store = CSS×dpr 恰好
               1:1 物理像素，无需任何 image-rendering 处理；此前 pixelated 在 dpr>1
               时对 1× 位图做非整数倍最近邻放大反而导致文字发虚，已移除。 */
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            justify-content: center;
            color: #ffd782;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 16px;
            background: #0a0818;
            z-index: 10;
            opacity: 1;
            transition: opacity .6s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading .bar {
            width: 180px; height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,.12);
            overflow: hidden;
        }
        #loading .bar i {
            display: block; height: 100%; width: 40%;
            border-radius: 3px;
            background: #ffd782;
            animation: slide 1.1s ease-in-out infinite alternate;
        }
        @keyframes slide { from { margin-left: 0; } to { margin-left: 60%; } }
        #errlog {
            position: fixed; top: 0; left: 0;
            color: #f66; background: rgba(0,0,0,.85);
            font: 12px/1.4 Consolas, monospace;
            white-space: pre-wrap; z-index: 99; padding: 4px;
            max-width: 100%; max-height: 100%; overflow: auto;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div id="ld_msg">凡人修仙 · 加载中…</div>
        <div class="bar"><i></i></div>
        <div style="font-size:12px;color:#b8a8e0;">首次加载需要数秒，请稍候</div>
    </div>
    <div id="errlog"></div>
    <canvas id="glcanvas" tabindex='1'></canvas>
    <!-- miniquad 加载器：https://github.com/not-fl3/macroquad/blob/master/js/mq_js_bundle.js -->
    <!-- 缓存穿透：每次发版改 GAME_VER，wasm/bundle URL 带上版本参数，WebView 不会用旧缓存 -->
    <script>var GAME_VER = "1.9.2";</script>
    <script src="mq_js_bundle.js?v=1.9.2"></script>
    <script>
        // v1.5.0 H5 本地存档：注册 miniquad 插件，为 wasm 提供 localStorage 存取的 env 导入。
        // 必须在 load() 之前注册（register_plugins 在 wasm 实例化前消费 plugins 列表）。
        // Rust 侧 save.rs 的 wasm 后端按固定键读写，存档内容与桌面版 xiuxian_save.txt 完全同格式；
        // 长度一律 UTF-8 字节数（Rust 侧按字节分配缓冲区，中文字段 3 字节/字）。
        window.miniquad_add_plugin({
            name: "xx_storage",
            version: 1,
            register_plugin: function (importObject) {
                var XX_KEY = "xiuxian_save";
                importObject.env.xx_save_len = function () {
                    try {
                        var v = localStorage.getItem(XX_KEY);
                        return v == null ? -1 : new TextEncoder().encode(v).length;
                    } catch (e) { return -1; }
                };
                importObject.env.xx_save_read = function (ptr, len) {
                    try {
                        var v = localStorage.getItem(XX_KEY) || "";
                        var bytes = new TextEncoder().encode(v);
                        var arr = new Uint8Array(wasm_memory.buffer, ptr, len);
                        arr.set(bytes.subarray(0, len));
                    } catch (e) { console.error("xx_save_read:", e); }
                };
                importObject.env.xx_save_write = function (ptr, len) {
                    try {
                        var bytes = new Uint8Array(wasm_memory.buffer, ptr, len);
                        localStorage.setItem(XX_KEY, new TextDecoder("utf-8").decode(bytes));
                    } catch (e) { console.error("xx_save_write:", e); }
                };
            },
            on_init: function () {}
        });

        // v1.6.0 B 清晰度（移植自 GetFish v7.9.6）：GPU 能力懒探测。vendor/macroquad
        // 图集封顶补丁在 wasm 首次询问 gf_max_texture_size 时——此时 miniquad 已在
        // glcanvas 上建好渲染上下文——直接查询 MAX_TEXTURE_SIZE，图集按
        // min(设备上限) 动态封顶，配合 high_dpi 支撑 dpr>1 设备的原生字形栅格。
        // 必须在 load() 之前注册（与 xx_storage 同理）。
        var XX_GPU_OK = !!(window.WebGLRenderingContext || window.WebGL2RenderingContext);
        var XX_MAX_TEX = 0; // 0 = 未探测
        function xx_probe_max_tex() {
            if (XX_MAX_TEX) return XX_MAX_TEX;
            try {
                var c = document.getElementById("glcanvas");
                var gl = c.getContext("webgl2") || c.getContext("webgl") ||
                         c.getContext("experimental-webgl");
                if (gl) {
                    var v = gl.getParameter(gl.MAX_TEXTURE_SIZE);
                    if (typeof v === "number" && v > 0) XX_MAX_TEX = v;
                }
            } catch (e) { /* 探测失败走默认，图集侧另有 512 下限兜底 */ }
            if (!XX_MAX_TEX) XX_MAX_TEX = 8192;
            return XX_MAX_TEX;
        }
        window.miniquad_add_plugin({
            name: "xx_gpu",
            version: 1,
            register_plugin: function (importObject) {
                importObject.env.gf_max_texture_size = function () { return xx_probe_max_tex() | 0; };
            },
            // v1.8.2 注意：on_init 是无参调用（bundle: e[t].on_init()），拿不到
            // exports；就绪信号改由下方 WebAssembly.instantiate 钩子赋值。
            on_init: function () {}
        });

        // v1.8.2 关键修复：加载层"就绪"信号。此前 window.wasm_exports 从未被
        // 任何人赋值——12 秒看门狗必然把加载层变成"加载失败·点击重试"覆盖层
        //（pointer-events:auto + reload），玩家一点就无限重载：手机上表现为
        // "点按钮没反应/再也加载不进去"。这里包装 WebAssembly.instantiate，
        // 实例化完成即把 exports 挂到 window（bundle 的 load 走 compileStreaming
        // + WebAssembly.instantiate 两步，本钩子先于 bundle 的 then 执行）。
        (function () {
            var _inst = WebAssembly.instantiate;
            WebAssembly.instantiate = function () {
                return _inst.apply(this, arguments).then(function (res) {
                    if (res && res.instance && res.instance.exports) {
                        window.wasm_exports = res.instance.exports;
                    }
                    return res;
                });
            };
        })();


        // 打不开诊断：无 WebGL / 无 WebAssembly 时给出可见提示，而不是无限白屏
        function xx_gpu_report() {
            var el = document.getElementById("errlog");
            var msgs = "";
            if (!XX_GPU_OK) {
                msgs += "诊断：此设备的 WebView 未开启 WebGL 硬件加速，游戏画面无法创建。\n" +
                        "请到系统/浏览器设置开启「硬件加速」后重试。\n";
            }
            if (!window.WebAssembly) {
                msgs += "诊断：此设备的 WebView 过旧、不支持 WebAssembly，无法运行游戏。\n" +
                        "请升级系统 WebView 或更换设备。\n";
            }
            if (msgs) {
                el.textContent += msgs;
                var m = document.getElementById("ld_msg");
                if (m) m.textContent = "设备不支持，无法运行（详见页面诊断信息）";
            }
        }
        xx_gpu_report();
    </script>
    <script>
        var errlog = document.getElementById("errlog");
        // 加载阶段标记：写在加载层的消息节点上，真机"打不开"时能看出卡在哪一步。
        // v1.9.1：所有阶段提示统一走 ld_msg 节点（此前直接覆盖 #loading 的
        // textContent 会连进度条一起抹掉），并叠加"已等待 N 秒"——手机上大包
        // 首次下载+编译要 10~40 秒，让玩家确认页面没死、不再乱点黑屏。
        var xxLoading = document.getElementById("loading");
        var xxMsg = document.getElementById("ld_msg");
        var xxStageMsg = "加载中…";
        var xxLoadStart = performance.now();
        function xx_paint_stage() {
            if (xxMsg && xxLoading && !xxLoading.classList.contains("hidden")) {
                var s = Math.round((performance.now() - xxLoadStart) / 1000);
                xxMsg.textContent =
                    "凡人修仙 v" + GAME_VER + " · " + xxStageMsg + "（已等待 " + s + " 秒）";
            }
        }
        function xx_stage(msg) {
            xxStageMsg = msg;
            xx_paint_stage();
        }
        setInterval(xx_paint_stage, 1000);
        // 诊断区盖上版本号：真机反馈时一眼确认跑的是哪版（防"上传了但设备吃旧缓存"）
        errlog.textContent = "v" + GAME_VER + (errlog.textContent ? "\n" + errlog.textContent : "");

        // v1.9.2：backing 强制重同步（提升到块级作用域——pollFirstFrame 的 wasm
        // 就绪钩子也要用）。置 0 后 dispatch resize，强制 bundle 的 resize() 走
        // "变化"分支、必然回调 wasm_exports.resize(backing)——screen_size 与
        // canvas.width 严格同步，渲染与输入回到同一坐标系。
        // 背景：bundle 的 resize() 仅在 canvas.width 与重算值不同时才通知 wasm，
        // 启动期 setup_canvas_size 静默设好 backing 且不通知 → wasm 的 screen_size
        // 停留初始 1280×720 → 信箱相机 fit 失真 → 游戏收到的虚拟坐标整体偏移
        // （按钮激活点跑到左上方），渲染被 GL 拉伸再被 CSS 缩回（不变形但降质）。
        window.resyncBacking = function () {
            var cv = document.getElementById("glcanvas");
            cv.width = 0;
            cv.height = 0;
            window.dispatchEvent(new Event("resize"));
        };
        window.onerror = function (msg, src, line, col, err) {
            errlog.textContent += "ERR: " + msg + " @" + (src || "") + ":" + line + "\n" +
                (err && err.stack ? err.stack : "") + "\n";
        };
        // Promise 链上的失败（如 wasm 实例化被拒）不经过 window.onerror，单独兜底
        window.addEventListener("unhandledrejection", function (ev) {
            var r = ev && ev.reason;
            errlog.textContent += "ERR(promise): " + (r && (r.message || r) || "unknown") + "\n" +
                (r && r.stack ? r.stack + "\n" : "");
        });
        var isFile = location.protocol === "file:";
        if (isFile) {
            // 浏览器禁止 file:// 加载 WASM，直接给出提示而不是一片空白
            errlog.textContent = "无法以 file:// 方式运行游戏（浏览器禁止 file:// 加载 WASM）。\n\n" +
                "【手动】先启动本地服务器：\n" +
                "  cd E:\\Rust_Game\\Daoism_Game\\web\n" +
                "  python -m http.server 8124\n\n" +
                "然后浏览器打开：http://localhost:8124/";
            document.getElementById("loading").textContent = "请通过 http://localhost:8124/ 访问";
        } else {
            // 点击/触摸时聚焦 canvas，保证进入游戏后键盘输入立即可用
            var glcanvas = document.getElementById("glcanvas");
            ["pointerdown", "touchstart", "click"].forEach(function (ev) {
                glcanvas.addEventListener(ev, function () { glcanvas.focus(); }, { passive: true });
            });
            // WebGL 上下文丢失处理：miniquad 不注册任何 handler，手机 WebView
            // 切后台被系统回收 GL 上下文后恢复时纹理全空 → 整个 UI 变黑。
            // contextlost 必须 preventDefault 才允许恢复；restored 后 miniquad 不会
            // 重建任何纹理，唯一可靠做法是整页重载（存档已在关键操作时落盘，进度不丢）
            glcanvas.addEventListener("webglcontextlost", function (e) {
                e.preventDefault();
                errlog.textContent += "WARN: WebGL 上下文丢失（切后台/显存回收），等待恢复…\n";
            }, false);
            glcanvas.addEventListener("webglcontextrestored", function () {
                location.reload();
            }, false);
            // v1.8.4 关键修复：把帧循环的 requestAnimationFrame 底座换成
            // setTimeout——TapTap 容器会把页面标记为不可见从而挂起 rAF，
            // 主循环停摆后画面定格、所有点击无人消费（红米 K80 Pro 实测
            // "点按钮没反应"的最终根因）。setTimeout 前台 ~16ms ≈ 60fps，
            // 且不受可见性挂起影响。单帧源、零逻辑改动。
            (function () {
                // v1.8.8 帧驱动 v2：多时钟共存 + 全局帧门闩 + 停摆自愈。
                // 背景：TapTap 容器对不可见页面会挂起 rAF、钳制定时器、静默禁用
                // blob Worker——任何单一时钟都可能停摆（实测：启动 53fps 后定格）。
                // 现在所有时钟同时启动，帧率由全局门闩统一限制（~60fps）：
                // 任一时钟被挂起，其余自动补位；全部停摆超过 800ms 时重建
                // MessageChannel 通道自愈。输入处理见 pointer/touch/mouse 接管段。
                var el = document.getElementById("errlog");
                var cb = null;
                var frames = 0;
                var last = 0;
                var lastFrameAt = 0;
                var rebuilt = 0;
                window.requestAnimationFrame = function (f) {
                    cb = f;
                    return 0;
                };
                window.cancelAnimationFrame = function () {};
                var tick = function (now) {
                    if (now - last < 14) return; // 全局帧门闩：~60fps 上限，多时钟共存不叠加
                    last = now;
                    lastFrameAt = now;
                    frames += 1;
                    var f = cb;
                    if (!f) return;
                    try {
                        f(now);
                    } catch (err) {
                        el.textContent += "[ERR] frame " + String(err).slice(0, 120);
                        cb = null;
                    }
                };
                // 时钟 1：MessageChannel 自循环（hidden 不节流）
                var chan = null;
                function buildChan() {
                    try {
                        var ch = new MessageChannel();
                        ch.port1.onmessage = function () {
                            tick(performance.now());
                            // 4ms 心跳投递：port 消息不受可见性节流，帧率由 tick 门闩限制
                            if (chan === ch) {
                                setTimeout(function () {
                                    if (chan === ch) ch.port2.postMessage(0);
                                }, 4);
                            }
                        };
                        ch.port2.postMessage(0);
                        chan = ch;
                        return true;
                    } catch (e) {
                        return false;
                    }
                }
                // 时钟 2：Worker 定时器（worker 端不受可见性节流）
                var worker = null;
                function buildWorker() {
                    try {
                        var wcode = "setInterval(function(){postMessage(0)},16);";
                        worker = new Worker(
                            URL.createObjectURL(new Blob([wcode], { type: "application/javascript" })),
                        );
                        worker.onmessage = function () { tick(performance.now()); };
                        return true;
                    } catch (e) {
                        return false;
                    }
                }
                // 时钟 3：setTimeout 循环（兜底，hidden 被钳 1fps 但绝不冻结）
                setInterval(function () { tick(performance.now()); }, 16);
                buildChan();
                buildWorker();
                // 停摆看门狗：>800ms 无帧 → 重建 MessageChannel 并重发 rAF 循环
                setInterval(function () {
                    if (!window.wasm_exports) return;
                    var since = performance.now() - lastFrameAt;
                    if (since > 800 && rebuilt < 6) {
                        rebuilt += 1;
                        if (chan) {
                            chan.port1.onmessage = null;
                            chan = null;
                        }
                        buildChan();
                        if (el && rebuilt === 1) {
                            el.textContent += "[诊断] 帧驱动停摆，已自动重建时钟";
                        }
                    }
                }, 500);
            })();
            xx_stage("编译游戏引擎…");
            try {
                load("xiuxian.wasm?v=" + GAME_VER);
            } catch (e) {
                errlog.textContent += "load() threw: " + (e && e.message ? e.message : e) + "\n";
            }
            // 加载分阶段提示：游戏包含内嵌立绘、体积较大，手机上首次下载+编译
            // 需要 10~40 秒——中途给状态文字，避免玩家以为卡死
            var stageTimers = [
                [12, "游戏包较大，首次加载约需 10~40 秒，请稍候…"],
                [30, "仍在编译游戏引擎（低端设备会慢一些），请继续等待…"],
            ];
            stageTimers.forEach(function (st) {
                setTimeout(function () {
                    if (!window.wasm_exports) xx_stage(st[1]);
                }, st[0] * 1000);
            });
            // 加载看门狗：45 秒仍未就绪（无 WebGL/无 WASM/网络失败都会卡在
            // 白屏加载层）才把加载层变成可点的重试按钮。
            // v1.8.2 前此值为 12 秒且 window.wasm_exports 恒为 undefined，
            // 手机上必触发"加载失败→点击→reload"无限循环（玩家实测反馈）。
            setTimeout(function () {
                if (!window.wasm_exports && xxLoading &&
                    !xxLoading.classList.contains("hidden")) {
                    xx_stage("加载失败或超时，点击此处重试");
                    xxLoading.style.pointerEvents = "auto";
                    xxLoading.onclick = function () { location.reload(); };
                }
            }, 45000);
        }
        // 首帧检测：wasm 导出就绪（on_init 里 window.wasm_exports 被赋值）即隐藏
        // 加载覆盖层。用 setInterval 而非 rAF：页面不可见时 rAF 会被挂起。
        // v1.8.2：删除旧的"8 秒无条件隐藏"兜底——它会在 12MB 包还在编译时
        // 提前撤掉加载层，玩家面对黑屏点击（点按钮没反应的第一诱因）。
        (function pollFirstFrame() {
            var loading = document.getElementById("loading");
            var synced = false;
            function onReady() {
                if (synced) return;
                synced = true;
                loading.classList.add("hidden");
                // v1.9.2 关键修复：wasm 就绪那一刻无条件强制重同步 backing。
                // v1.9.1 的重同步只挂在固定 1 秒定时器与"backing ≠ CSS×dpr"差异
                // 检测上：手机上 wasm 10~40 秒后才就绪（1 秒定时器早已空跑），
                // dpr 又稳定（差异检测永不触发）——setup_canvas_size 静默设置的
                // backing 始终没通知 wasm，screen_size 停留初始 1280×720，虚拟
                // 坐标整体偏移（激活点在按钮左上方）依旧。就绪钩子保证任何设备、
                // 任何时序下，backing 与 wasm screen_size 必然同步一次；此后
                // 尺寸再变化走 bundle 的 resize（带 wasm 通知）+ 差异检测兜底。
                window.resyncBacking();
                setTimeout(window.resyncBacking, 2000); // 兜底：就绪初期容器布局抖动
            }
            var timer = setInterval(function () {
                if (window.wasm_exports) onReady();
            }, 250);
        })();
        // v1.8.2 指针自愈（两条）：
        // 1) dpr/backing 失步自愈——miniquad 只在 resize 事件重算 backing，若
        //    devicePixelRatio 在实例化前后发生变化（浏览器缩放/分屏/机型切换），
        //    backing 与指针缩放系数脱钩，所有点击错位。检测到失步就合成一次
        //    resize（bundle 的 window.onresize 会重算双方），免重载自愈。
        // 2) 竖屏旋转点击映射——orientFix 把整页 rotate(90deg) 后，视觉坐标系
        //    与页面坐标系相差一个旋转，miniquad 的线性换算全部错位（竖持手机
        //    点按钮没反应的第二诱因）。在 canvas 捕获阶段拦截鼠标/触摸事件，
        //    旋转时先 stopImmediatePropagation 再派发"换算后的同型事件"
        //    （clientX/clientY 对调并翻转），bundle 原处理逻辑零改动。
        (function pointerSetup() {
            var canvas = document.getElementById("glcanvas");
            // v1.8.3 指针映射彻底接管：不再依赖 miniquad 基于 devicePixelRatio 的
            // 线性换算（TapTap 容器缩放/顶部横幅占位/dpr 漂移都会让它失准，手机
            // 实测点按钮没反应），改用 getBoundingClientRect 实测比例直接驱动
            // wasm 导出。竖屏旋转（orientFix 的 90° 页面旋转）用归一坐标旋转逆
            // 映射：(nx,ny) → (ny, 1-nx)。
            var rotationAware = function (e) {
                var r = canvas.getBoundingClientRect();
                if (r.width < 1 || r.height < 1) return null;
                var nx = (e.clientX - r.left) / r.width;
                var ny = (e.clientY - r.top) / r.height;
                if (!(nx >= 0 && nx <= 1 && ny >= 0 && ny <= 1)) return null;
                var portrait = window.innerHeight > window.innerWidth;
                if (!portrait) return { x: nx * canvas.width, y: ny * canvas.height };
                return { x: ny * canvas.width, y: (1 - nx) * canvas.height };
            };
            var btn = function (b) { return b === 1 ? 2 : b === 2 ? 1 : b | 0; };
            var takeOver = function () {
                if (!window.wasm_exports || canvas.__ptr_taken) return;
                canvas.__ptr_taken = true;
                var E = window.wasm_exports;
                canvas.onmousemove = function (e) {
                    var p = rotationAware(e);
                    if (p) E.mouse_move(p.x | 0, p.y | 0);
                };
                canvas.onmousedown = function (e) {
                    var p = rotationAware(e);
                    if (p) E.mouse_down(p.x | 0, p.y | 0, btn(e.button));
                };
                canvas.onmouseup = function (e) {
                    var p = rotationAware(e);
                    if (p) E.mouse_up(p.x | 0, p.y | 0, btn(e.button));
                };
                // 触摸：bundle 用 addEventListener（无法覆盖属性），在 document
                // 捕获阶段拦下并直接调 wasm_exports.touch，坐标同样实测换算。
                var el = document.getElementById("errlog");
                var seen = false;
                var mark = function (kind) {
                    if (!seen) {
                        seen = true;
                        if (el) el.textContent += "[诊断] 已收到输入事件（" + kind + "）\n";
                    }
                };
                var TOUCH = { touchstart: 10, touchmove: 11, touchend: 12, touchcancel: 13 };
                Object.keys(TOUCH).forEach(function (type) {
                    document.addEventListener(
                        type,
                        function (e) {
                            if (e.target !== canvas) return;
                            e.preventDefault();
                            e.stopImmediatePropagation();
                            mark("touch");
                            for (var i = 0; i < e.changedTouches.length; i++) {
                                var t = e.changedTouches[i];
                                var p = rotationAware(t);
                                if (!p) continue;
                                E.touch(TOUCH[type], t.identifier, p.x, p.y);
                                // 同步鼠标状态：游戏按钮判定走鼠标通路
                                E.mouse_move(p.x | 0, p.y | 0);
                                if (type === "touchstart") E.mouse_down(p.x | 0, p.y | 0, 0);
                                if (type === "touchend" || type === "touchcancel") E.mouse_up(p.x | 0, p.y | 0, 0);
                            }
                        },
                        true,
                    );
                });
                // pointer 兜底：个别内核只派发 pointer 事件不发 compat mouse
                var POINTER = { pointerdown: 0, pointermove: -1, pointerup: 0 };
                Object.keys(POINTER).forEach(function (type) {
                    canvas.addEventListener(type, function (e) {
                        if (e.pointerType === "touch") return; // 触摸走上面通道
                        mark("pointer");
                        var p = rotationAware(e);
                        if (!p) return;
                        E.mouse_move(p.x | 0, p.y | 0);
                        if (type === "pointermove") return;
                        if (type === "pointerdown") E.mouse_down(p.x | 0, p.y | 0, 0);
                        else E.mouse_up(p.x | 0, p.y | 0, 0);
                    });
                });
                // 兼容 mouse 首达诊断
                canvas.onmousemove = (function (orig) {
                    return function (e) {
                        mark("mouse");
                        var p = rotationAware(e);
                        if (p) E.mouse_move(p.x | 0, p.y | 0);
                    };
                })();
                canvas.onmousedown = function (e) {
                    var p = rotationAware(e);
                    if (p) E.mouse_down(p.x | 0, p.y | 0, btn(e.button));
                };
                canvas.onmouseup = function (e) {
                    var p = rotationAware(e);
                    if (p) E.mouse_up(p.x | 0, p.y | 0, btn(e.button));
                };
            };
            setInterval(takeOver, 500);
            // v1.9.2 差异检测维持同步：容器缩放/dpr 漂移导致 backing ≠ CSS×dpr 时
            // 重新强制同步（resyncBacking 定义见上方块级作用域；置 0 保证 wasm 必然
            // 收到 resize 通知）。注意这只覆盖"dpr 漂移"场景——dpr 稳定的手机上
            // 该检测永不触发，启动期的静默失步由 pollFirstFrame 的就绪钩子负责。
            var heals = 0;
            setInterval(function () {
                if (!window.wasm_exports) return;
                var dpr = window.high_dpi ? window.devicePixelRatio || 1 : 1;
                var w = Math.floor(canvas.clientWidth * dpr);
                var h = Math.floor(canvas.clientHeight * dpr);
                if ((canvas.width !== w || canvas.height !== h) && heals < 30) {
                    heals += 1;
                    window.resyncBacking();
                }
            }, 1500);
            // 竖持提示：横版游戏竖持时世界两侧出屏、按钮不可见——给出引导而不是
            // 让玩家以为"点了没反应"
            var rot = document.createElement("div");
            rot.id = "rot_hint";
            rot.textContent = "请横持设备游玩";
            rot.style.cssText =
                "position:fixed;left:0;top:0;width:100%;height:100%;display:none;" +
                "align-items:center;justify-content:center;background:#141024;color:#d8c48a;" +
                "font:24px sans-serif;z-index:50;pointer-events:none;";
            document.body.appendChild(rot);
            function rotHint() {
                rot.style.display =
                    window.innerHeight > window.innerWidth && window.wasm_exports ? "flex" : "none";
            }
            window.addEventListener("resize", rotHint, true);
            setInterval(rotHint, 800);
        })();
        // 手机竖持时强制横屏视野：整页旋转 90°（TapTap/X5 内核横屏不旋转页面的标准解法）。
        // 缩放交由 Rust 侧信箱相机（src/cam.rs）等比适配，此处原样 JS 零缩放。
        function orientFix() {
            var b = document.body;
            if (window.innerHeight > window.innerWidth) {
                b.style.transformOrigin = "left top";
                b.style.transform = "rotate(90deg) translate(0px, -100%)";
                b.style.width = window.innerHeight + "px";
                b.style.height = window.innerWidth + "px";
            } else {
                b.style.transform = "";
                b.style.width = "100%";
                b.style.height = "100%";
            }
            var c = document.getElementById("glcanvas");
            if (c) {
                c.style.width = "100%";
                c.style.height = "100%";
            }
        }
        window.addEventListener("resize", orientFix);
        window.addEventListener("orientationchange", function () { setTimeout(orientFix, 120); });
        window.addEventListener("load", orientFix);
        // v1.9.1 关键修复：删除 macroquad 模板遗留的"load 事件隐藏加载层"。
        // window.load 只等文档资源就绪，不等 wasm（fetch 不阻塞 load）——加载层
        // 在页面打开约 1 秒内就被 display:none 撤掉，之后手机上 wasm 下载+编译的
        // 10~40 秒里玩家面对纯黑画布：分阶段提示与 45s 重试看门狗全部被废，
        // 点哪都没反应（TapTap 真机"无法进入游戏、点击没反应"的最终根因）。
        // 加载层的隐藏只由 pollFirstFrame 负责：window.wasm_exports 就绪才撤。

    </script>
</body>
</html>
