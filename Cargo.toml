[package]
name = "xiuxian"
version = "1.16.17"
edition = "2021"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }

# v1.16.8 加载小刀③：字体以 raw-deflate 承载（assets/font.ttf.deflate，
# make_font.py 产出并回环自检），boot 头 ui.rs init_font_from_bytes 内同步 inflate。
# v1.16.10 字体外置：wasm 端字节经 index.html xx_font env 插件回传（与 wasm 下载
# 全并行预取），include_bytes 副本仅桌面保留（ui.rs cfg(not wasm32) 包住表本体）；
# wasm 数据段减去整个字体 deflate（~378KB，≈旧 wasm 31%），桌面构建产物零变化。
miniz_oxide = "0.8"

# v1.6.0 B 清晰度：wasm 也开 high_dpi 后，dpr>1 设备上默认 4096 图集不够用
# （字形按物理像素栅格）。vendor/macroquad 0.4.16 与依赖同版本，含图集封顶
# 补丁（atlas 按 gf_max_texture_size 动态封顶 + 原地重置）与 text.rs 丢失重栅格化，
# PATCH(getfish) 标记，符号名保持 gf_max_texture_size。features=["audio"] 经
# path 依赖仍生效（features 合并规则不变）。
[patch.crates-io]
macroquad = { path = "vendor/macroquad" }

# v1.15.1 防 trap 毒化：wasm 下 JS 捕获 trap 后线性内存存续，miniquad
# native/wasm.rs 的 tl_event_handler/REQUESTS RefCell 借用标志永久残留 →
# 之后所有 frame/touch/mouse 调用永远 panic "already borrowed"（真机 TapTap
# 实证：模拟中点跳过/选项触发一次 panic 后输入全灭、errlog 刷屏、看门狗重载
# 循环）。vendor/miniquad 0.4.11 同版本，改 UnsafeCell 裸访问（单线程 wasm
# 无真并发；JS 侧 import 处理器不回调 wasm 导出，无重入路径），trap 后自愈。
miniquad = { path = "vendor/miniquad" }

# v1.9.24 内存/体积优化：LTO+单编译单元+去符号让 wasm 从 2.3MB 显著瘦身
# （手机上下载/解析/编译的峰值内存同步下降）；strip 去符号不碍 panic 钩子输出。
# 加载提速①：opt-level 3→"z"（体积优先）。本作回合制 UI，热点在 boot 期
# 程序纹理逐像素循环与仿真 tick，z 档减速可承受；lto/codegen-units/panic/
# strip 四项不动（构建管线既有口径）。
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
